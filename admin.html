<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attendance Admin</title>
<style>
:root{--bg:#f3f5f9;--ink:#14213d;--mut:#6b7488;--pri:#0b5ed7;--ok:#12855a;--bad:#c62f3e;--line:#e2e6ee}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
.hdr{background:var(--ink);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
.hdr b{font-size:17px}.hdr button{background:#ffffff22;color:#fff;border:0;padding:7px 12px;border-radius:8px}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:6px 10px;position:sticky;top:52px;z-index:4}
nav button{flex:1;white-space:nowrap;border:0;background:none;padding:10px 14px;border-radius:8px;font-weight:600;color:var(--mut)}nav button.on{background:#e8f0fe;color:var(--pri)}
main{max-width:1100px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}h3{margin:0 0 10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.stat small{color:var(--mut)}.stat div{font-size:28px;font-weight:700;margin-top:4px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid #cfd5e1;border-radius:8px;font-size:15px;background:#fff}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;align-items:end}
.btn{background:var(--pri);color:#fff;border:0;padding:10px 16px;border-radius:8px;font-weight:600;font-size:15px}.btn.g{background:#eef1f6;color:var(--ink)}.btn.r{background:var(--bad)}.btn.s{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.6}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:14px;white-space:nowrap}th{background:#f7f8fb;color:var(--mut)}
.tag{padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600}.tag.p{background:#dff5ea;color:var(--ok)}.tag.a{background:#fde4e6;color:var(--bad)}
#login{max-width:380px;margin:12vh auto;padding:0 16px}#msg{color:var(--bad);font-size:13px;margin-top:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:30px;z-index:9;display:none}
.load{position:fixed;top:0;left:0;right:0;height:3px;background:var(--pri);z-index:20;display:none}
[hidden]{display:none!important}@media print{.hdr,nav,.noprint{display:none!important}body{background:#fff}}
</style></head><body>
<div class="load" id="ld"></div>
<div id="login"><div class="card"><h3 style="font-size:20px">Admin Login</h3>
<label>Admin Password</label><input id="pw" type="password" onkeydown="if(event.key==='Enter')doLogin()">
<button class="btn" style="width:100%;margin-top:14px" onclick="doLogin()">Login</button><div id="msg"></div></div></div>

<div id="app" hidden>
<div class="hdr"><b id="org">Attendance Admin</b><button onclick="logout()">Logout</button></div>
<nav id="nav"></nav>
<main>
<section id="t-dash"><div class="grid" id="stats"></div><div class="card"><h3>Aaj ki attendance <span id="today"></span></h3><div class="tw"><table id="tdash"></table></div></div></section>
<section id="t-staff" hidden>
 <div class="card"><h3>Staff add / edit</h3><div class="row">
 <div><label>Name</label><input id="sn"></div><div><label>Mobile (10 digit)</label><input id="sm" inputmode="numeric" maxlength="10"></div>
 <div><label>User ID</label><input id="su"></div><div><label>Designation</label><input id="sd"></div><button class="btn" onclick="saveStaff()">Save</button></div></div>
 <div class="card"><h3>Staff list</h3><div class="tw"><table id="tstaff"></table></div></div></section>
<section id="t-rep" hidden>
 <div class="card noprint"><h3>Report</h3><div class="row">
 <div><label>From</label><input id="rf" type="date"></div><div><label>To</label><input id="rt" type="date"></div>
 <div><label>Staff</label><select id="rs"><option value="">All</option></select></div>
 <button class="btn" onclick="report()">Show</button><button class="btn g" onclick="csv()">CSV</button><button class="btn g" onclick="print()">Print</button></div></div>
 <div class="card"><h3>Summary</h3><div class="tw"><table id="tsum"></table></div></div>
 <div class="card"><h3>Details</h3><div class="tw"><table id="trep"></table></div></div></section>
<section id="t-set" hidden>
 <div class="card"><h3>Office location</h3><div class="row">
 <div><label>Organisation name</label><input id="on"></div><div><label>Latitude</label><input id="la"></div>
 <div><label>Longitude</label><input id="lo"></div><div><label>Radius (meter)</label><input id="ra" type="number"></div></div>
 <div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn g" onclick="myLoc()">Meri current location lo</button><button class="btn" onclick="saveSet()">Save</button></div>
 <p style="color:var(--mut);font-size:13px">Admin password badalne ke liye Google Sheet ke Config tab mein adminPass badlein.</p></div></section>
</main></div>
<div class="toast" id="toast"></div>

<script>
/* ====== APNA APPS SCRIPT URL ====== */
const API_URL="https://script.google.com/macros/s/AKfycby73nfXpP68MBMEkXhuB2s1rbjfGWnmuCgDSpdP2jk3ygCEndcEAEfl_96bQHGvYXyk/exec";
const $=i=>document.getElementById(i),iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=t=>{const e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",2600)};
let PASS=sessionStorage.getItem("ap")||"",users=[],cfg={},rows=[];
async function api(b){$("ld").style.display="block";try{const r=await fetch(API_URL,{method:"POST",body:JSON.stringify({...b,pass:PASS})});return await r.json()}catch(e){return{ok:false,msg:"Network error, internet check karein"}}finally{$("ld").style.display="none"}}

async function doLogin(){PASS=$("pw").value;$("msg").textContent="";const t=iso(new Date()),r=await api({a:"adminData",from:t,to:t});
 if(!r.ok){$("msg").textContent=r.msg;return}sessionStorage.setItem("ap",PASS);enter(r)}
function logout(){sessionStorage.removeItem("ap");location.reload()}
(async()=>{if(PASS){const t=iso(new Date()),r=await api({a:"adminData",from:t,to:t});if(r.ok)enter(r)}})();

const tabs={dash:"Dashboard",staff:"Staff",rep:"Report",set:"Settings"};
$("nav").innerHTML=Object.entries(tabs).map(([k,v])=>`<button data-k="${k}" onclick="tab('${k}')">${v}</button>`).join("");
function enter(r){$("login").hidden=true;$("app").hidden=false;sync(r);const d=new Date();d.setDate(1);$("rf").value=iso(d);$("rt").value=iso(new Date());dash(r)}
function sync(r){users=r.users;cfg=r.cfg;$("org").textContent=cfg.org||"Attendance Admin";
 $("rs").innerHTML='<option value="">All</option>'+users.map(s=>`<option value="${s.mobile}">${esc(s.name)}</option>`).join("")}
async function tab(k){for(const t in tabs)$("t-"+t).hidden=t!==k;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));
 if(k==="dash"){const t=iso(new Date()),r=await api({a:"adminData",from:t,to:t});if(r.ok){sync(r);dash(r)}}
 if(k==="staff")stf();if(k==="rep")report();
 if(k==="set"){$("on").value=cfg.org||"";$("la").value=cfg.lat||"";$("lo").value=cfg.lng||"";$("ra").value=cfg.radius||100}}
document.querySelector('#nav button').classList.add("on");

function dash(r){const all=r.att,a=all.filter(x=>x.status!=="AUTO"),au=all.filter(x=>x.status==="AUTO"),act=users.filter(s=>s.active==="YES"),got=new Set(all.map(x=>x.mobile));$("today").textContent="("+iso(new Date())+")";
 $("stats").innerHTML=[["Total staff",act.length],["Present",a.length],["Absent",Math.max(act.length-a.length,0)],["Checked out",a.filter(x=>x.outTime).length]].map(([k,v])=>`<div class="stat"><small>${k}</small><div>${v}</div></div>`).join("");
 $("tdash").innerHTML="<tr><th>Name</th><th>In</th><th>Out</th><th>Distance</th><th>Status</th></tr>"+a.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.inTime||"-"}</td><td>${x.outTime||"-"}</td><td>${x.inDist||"-"} m</td><td><span class="tag p">Present</span></td></tr>`).join("")+au.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.inTime||"-"}</td><td>${x.outTime||"-"} (auto)</td><td>${x.inDist||"-"} m</td><td><span class="tag a">Absent (Auto out)</span></td></tr>`).join("")+act.filter(s=>!got.has(s.mobile)).map(s=>`<tr><td>${esc(s.name)}</td><td>-</td><td>-</td><td>-</td><td><span class="tag a">Absent</span></td></tr>`).join("")}

function stf(){$("tstaff").innerHTML="<tr><th>Name</th><th>Mobile</th><th>User ID</th><th>Designation</th><th>Status</th><th></th></tr>"+users.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.mobile}</td><td>${esc(s.userId)}</td><td>${esc(s.designation)}</td><td><span class="tag ${s.active==="YES"?"p":"a"}">${s.active==="YES"?"Active":"Blocked"}</span></td>
 <td><button class="btn g s" onclick="editS('${s.mobile}')">Edit</button> <button class="btn g s" onclick="togS('${s.mobile}')">${s.active==="YES"?"Block":"Unblock"}</button> <button class="btn r s" onclick="delS('${s.mobile}')">Delete</button></td></tr>`).join("")}
async function reload(){const t=iso(new Date()),r=await api({a:"adminData",from:t,to:t});if(r.ok){sync(r);stf()}}
async function saveStaff(){const m=$("sm").value.trim(),n=$("sn").value.trim(),u=$("su").value.trim();
 if(!/^\d{10}$/.test(m))return toast("Mobile 10 digit ka dalein");if(!n||!u)return toast("Name aur User ID zaruri hai");
 const o=users.find(s=>s.mobile===m),r=await api({a:"adminSaveUser",name:n,mobile:m,userId:u,designation:$("sd").value.trim(),active:o?o.active:"YES"});
 if(!r.ok)return toast(r.msg);["sn","sm","su","sd"].forEach(i=>$(i).value="");toast("Saved");reload()}
function editS(m){const s=users.find(x=>x.mobile===m);$("sn").value=s.name;$("sm").value=s.mobile;$("su").value=s.userId;$("sd").value=s.designation;scrollTo(0,0)}
async function togS(m){const s=users.find(x=>x.mobile===m);await api({a:"adminSaveUser",...s,active:s.active==="YES"?"NO":"YES"});reload()}
async function delS(m){if(confirm("Staff delete karein?")){await api({a:"adminDelUser",mobile:m});reload()}}

function hrs(a,b){if(!a||!b)return"-";const[x,y]=a.split(":"),[p,q]=b.split(":"),m=(p*60+ +q)-(x*60+ +y);return m>0?Math.floor(m/60)+"h "+m%60+"m":"-"}
async function report(){const f=$("rf").value,t=$("rt").value,s=$("rs").value;if(!f||!t)return toast("Date chunein");
 const r=await api({a:"adminData",from:f,to:t});if(!r.ok)return toast(r.msg);sync(r);$("rs").value=s;
 rows=r.att.filter(x=>!s||x.mobile===s).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.name.localeCompare(b.name));
 const days=Math.round((new Date(t)-new Date(f))/864e5)+1;
 $("tsum").innerHTML="<tr><th>Name</th><th>Present</th><th>Absent</th><th>Days</th></tr>"+(s?users.filter(x=>x.mobile===s):users.filter(x=>x.active==="YES")).map(x=>{const c=rows.filter(r=>r.mobile===x.mobile&&r.status!=="AUTO").length;return`<tr><td>${esc(x.name)}</td><td>${c}</td><td>${Math.max(days-c,0)}</td><td>${days}</td></tr>`}).join("");
 $("trep").innerHTML="<tr><th>Date</th><th>Name</th><th>Mobile</th><th>In</th><th>Out</th><th>Hours</th><th>In dist.</th><th>Map</th></tr>"+rows.map(r=>`<tr><td>${r.date}</td><td>${esc(r.name)}</td><td>${r.mobile}</td><td>${r.inTime||"-"}</td><td>${r.outTime||"-"}${r.status==="AUTO"?' <span class="tag a">Auto - Absent</span>':""}</td><td>${r.status==="AUTO"?"-":hrs(r.inTime,r.outTime)}</td><td>${r.inDist||"-"} m</td><td>${r.inLat?`<a href="https://maps.google.com/?q=${r.inLat},${r.inLng}" target="_blank">View</a>`:"-"}</td></tr>`).join("")||"<tr><td colspan=8>Koi record nahi</td></tr>"}
function csv(){if(!rows.length)return toast("Pehle report dekhein");
 const c=[["Date","Name","Mobile","In","Out","Hours","InDistance(m)","OutDistance(m)"],...rows.map(r=>[r.date,r.name,r.mobile,r.inTime,r.outTime,hrs(r.inTime,r.outTime),r.inDist,r.outDist])].map(a=>a.map(v=>`"${v||""}"`).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+c],{type:"text/csv"}));a.download="attendance_"+$("rf").value+"_to_"+$("rt").value+".csv";a.click()}

function myLoc(){navigator.geolocation.getCurrentPosition(p=>{$("la").value=p.coords.latitude.toFixed(6);$("lo").value=p.coords.longitude.toFixed(6);toast("Location mil gayi")},()=>toast("Location permission dein"),{enableHighAccuracy:true})}
async function saveSet(){const la=parseFloat($("la").value),lo=parseFloat($("lo").value);if(isNaN(la)||isNaN(lo))return toast("Latitude/Longitude dalein");
 const r=await api({a:"adminSaveConfig",org:$("on").value.trim(),lat:la,lng:lo,radius:parseInt($("ra").value)||100});toast(r.ok?"Saved":r.msg);if(r.ok){cfg={org:$("on").value.trim(),lat:la,lng:lo,radius:$("ra").value};$("org").textContent=cfg.org||"Attendance Admin"}}
</script></body></html>
